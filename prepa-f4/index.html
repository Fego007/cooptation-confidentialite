<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prépa F4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Prépa F4 2027</title>
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
:root{
  /* Plan : une colonne pensée pour le téléphone. Un panneau de stand noir et jaune porte la semaine
     et le compte à rebours ; tout le reste est calme. Codes couleur du chronométrage :
     vert = fait, jaune = express, rouge = à rattraper, violet = record. */
  --bg:#ECEEF2;
  --surface:#FFFFFF;
  --ink:#12161C;
  --muted:#5A6370;
  --line:#D3D8DF;
  --accent:#1B52C4;           /* bleu de France */
  --accent-ink:#FFFFFF;
  --ok:#0F8546; --ok-bg:#E1F3E8;
  --warn:#A56A00; --warn-bg:#FBEFCF;
  --bad:#C22F28; --bad-bg:#FBE4E2;
  --best:#7038D8; --best-bg:#EEE5FC;
  --board:#0B0D10; --board-plate:#171A1F; --board-ink:#F4E73B; --board-dim:#9097A1;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1115; --surface:#171B21; --ink:#ECEFF3; --muted:#9BA4B0; --line:#2A313A;
    --accent:#7CA6FF; --accent-ink:#0A1226;
    --ok:#43C985; --ok-bg:#12301F; --warn:#F0B93F; --warn-bg:#3A2C0A;
    --bad:#FF7268; --bad-bg:#3B1715; --best:#B690FF; --best-bg:#2A1C4B;
    --board:#000000; --board-plate:#14171B; --board-ink:#F4E73B; --board-dim:#8A919B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --ink:#ECEFF3; --muted:#9BA4B0; --line:#2A313A;
  --accent:#7CA6FF; --accent-ink:#0A1226;
  --ok:#43C985; --ok-bg:#12301F; --warn:#F0B93F; --warn-bg:#3A2C0A;
  --bad:#FF7268; --bad-bg:#3B1715; --best:#B690FF; --best-bg:#2A1C4B;
  --board:#000000; --board-plate:#14171B; --board-ink:#F4E73B; --board-dim:#8A919B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

.app{max-width:640px;margin:0 auto;padding:0 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:14px}
.brand{font:700 24px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.local i{background:var(--warn)}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.tabs a{font:600 17px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;text-align:center;padding:10px 2px;border-radius:8px;color:var(--muted);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
#view{display:flex;flex-direction:column;gap:14px}

/* panneau de stand */
.board{background:var(--board);border-radius:14px;padding:12px;display:grid;gap:10px;color:#fff}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.board-phase{font:600 16px/1.15 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.board-dates{font-size:13px;color:var(--board-dim);margin-top:2px}
.wk-nav{display:flex;gap:6px;flex:none}
.wk-nav button{width:40px;height:40px;border-radius:8px;border:1px solid #2B3038;background:var(--board-plate);color:#fff;font:700 22px/1 var(--font-display)}
.wk-nav button:disabled{opacity:.35;cursor:default}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plate{background:var(--board-plate);border-radius:8px;padding:8px 10px 6px;min-width:0}
.plate small{display:block;font:600 11px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate b{display:block;margin-top:5px;font:700 clamp(32px,10.5vw,54px)/.95 var(--font-display);color:var(--board-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
  .plate b{animation:slot .45s cubic-bezier(.2,.8,.2,1) both}
  .plate:nth-child(2) b{animation-delay:.06s} .plate:nth-child(3) b{animation-delay:.12s}
  @keyframes slot{from{transform:translateY(-10px)}to{transform:none}}
}

/* bandeau de la semaine */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 0 8px;display:grid;gap:3px;justify-items:center;min-width:0}
.day small{font-size:11px;line-height:1;color:var(--muted)}
.day b{font:700 22px/1 var(--font-display)}
.day i{width:60%;height:4px;border-radius:2px;background:var(--line)}
.day.ok i{background:var(--ok)} .day.warn i{background:var(--warn)} .day.bad i{background:var(--bad)}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.today small{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font:700 22px/1.1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.card h3{font:600 16px/1.2 var(--font-body)}
.eyebrow{font:600 13px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.session h1{font:700 30px/1.02 var(--font-display);letter-spacing:.01em;text-transform:uppercase;margin-top:4px;display:flex;gap:10px;align-items:flex-start}
.code{flex:none;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:7px;background:var(--ink);color:var(--bg);font:700 22px/1 var(--font-display)}
.meta{font-size:14px;color:var(--muted);margin-top:6px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.best{background:var(--best-bg);color:var(--best)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.2;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{padding:8px 10px;font-size:13px}
.btn.wide{width:100%}
.switch{display:flex;gap:10px;align-items:center;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--warn);flex:none}

.blocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.blk input[type=checkbox]{width:22px;height:22px;margin-top:1px;accent-color:var(--ok)}
.blk-t{font-weight:600;display:block}
.blk p{font-size:14px;color:var(--muted);margin-top:2px}
.blk.done .blk-t{text-decoration:line-through;text-decoration-color:var(--ok);color:var(--muted)}
.chrono{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 9px;font-size:11px;line-height:1.1;color:var(--muted);text-align:center;min-width:58px}
.chrono b{display:block;font:700 19px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.tests-in{grid-column:1/-1;background:var(--best-bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tests-in h3{color:var(--best)}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.field label{font-size:14px;font-weight:600}
.field small{grid-column:1/-1;font-size:13px;color:var(--muted)}
.inwrap{display:flex;align-items:center;gap:6px}
.inwrap input{width:84px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums;text-align:right}
.inwrap span{font-size:13px;color:var(--muted);min-width:22px}

.alert{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.alert.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.alert.info{background:var(--surface);border:1px solid var(--line)}
.alert b.h{font:700 17px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.alert.bad b.h{color:var(--bad)} .alert.warn b.h{color:var(--warn)}
.debt{display:flex;justify-content:space-between;align-items:center;gap:10px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font:700 30px/1 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}
.grid-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.grid th{font:600 12px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 2px;text-align:center}
.grid td{padding:3px 2px;text-align:center;border-top:1px solid var(--line)}
.grid td.wk{text-align:left;white-space:nowrap;font-weight:600}
.grid td.wk small{font-weight:400;color:var(--muted);margin-left:4px}
.grid tr.cur td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.grid tr.del td.wk::after{content:" tests";font-weight:400;color:var(--best);font-size:11px}
.dot{appearance:none;border:0;width:22px;height:22px;border-radius:6px;background:var(--line);padding:0}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dot.todo{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.dot.race{background:var(--board);box-shadow:inset 0 0 0 2px var(--board-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:7px;padding:8px 2px;font:600 16px/1 var(--font-display);letter-spacing:.05em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.trow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow .who{min-width:0}
.trow .who b{display:block;font-weight:600}
.trow .who small{display:block;font-size:13px;color:var(--muted)}
.trow .delta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.spark{display:block}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.list li::marker{color:var(--muted)}
.slots{display:grid;gap:0}
.slot{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.slot b{font:700 17px/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.slot small{display:block;color:var(--muted);font-size:13px}
.phase{appearance:none;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.phase b{font-weight:600} .phase small{color:var(--muted);font-size:13px;grid-column:1/-1}
.phase .pill{align-self:start}
textarea.copy{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:400 13px/1.4 var(--font-body)}

.how{grid-column:1/-1;display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px}
.how p{font-size:13px;line-height:1.4;color:var(--ink);margin:0}
.ill{display:block;width:128px;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ill .nb{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.ill .fb{stroke:var(--muted);stroke-width:5;stroke-linecap:round;opacity:.5}
.ill .hd{fill:var(--ink)}
.ill .fl{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.ill .bx{fill:var(--line)}
.ill .pr{stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.ill .eq{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.ill .bd{stroke:var(--warn);stroke-width:2;stroke-linecap:round}
.ill .ar{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round}
.ill .tx{font:600 7px var(--font-body);fill:var(--muted)}

/* chrono plein écran */
.timer{position:fixed;inset:0;z-index:20;background:var(--board);color:#fff;display:flex;flex-direction:column;padding:18px 20px 22px;gap:12px;overflow:auto}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-title{font:600 15px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--board-dim)}
.t-sound{appearance:none;border:1px solid #2B3038;background:var(--board-plate);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px}
.t-label{font:700 clamp(28px,8vw,44px)/1.02 var(--font-display);text-transform:uppercase;text-wrap:balance;min-height:2.1em}
.t-clock{font:700 clamp(104px,36vw,230px)/.86 var(--font-display);font-variant-numeric:tabular-nums;color:var(--board-ink);letter-spacing:-.01em}
.timer.rest .t-clock{color:#fff}
.timer.rest .t-label{color:var(--board-dim)}
.t-manual{font-size:18px;line-height:1.4;color:#E6E9ED}
.t-next{color:var(--board-dim);font-size:15px;min-height:1.5em}
.t-bar{height:6px;background:#23272E;border-radius:3px;overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--board-ink)}
.t-ctl{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t-ctl button{appearance:none;border:1px solid #2B3038;background:var(--board-plate);color:#fff;border-radius:12px;padding:16px 6px;font:600 18px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.t-ctl button.main{background:var(--board-ink);border-color:var(--board-ink);color:#0B0D10}
.t-ctl button:disabled{opacity:.35}
body.lock{overflow:hidden}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Prépa <span>F4</span> 2027</div>
    <div class="sync" id="sync"><i></i><span>Chargement</span></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#seance">Séance</a>
    <a href="#suivi">Suivi</a>
    <a href="#tests">Tests</a>
    <a href="#reperes">Repères</a>
  </nav>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="Chronomètre">
  <div class="t-head">
    <div class="t-title" id="t-title"></div>
    <button class="t-sound" id="t-sound" data-act="t-sound" type="button">Son : oui</button>
  </div>
  <div class="t-label" id="t-label"></div>
  <div class="t-clock" id="t-clock">0:00</div>
  <div class="t-manual" id="t-manual" hidden></div>
  <div class="t-bar"><i id="t-bar"></i></div>
  <div class="t-next" id="t-next"></div>
  <div class="t-ctl">
    <button type="button" data-act="t-stop" id="t-stop">Arrêter</button>
    <button type="button" data-act="t-pause" id="t-pause">Pause</button>
    <button type="button" data-act="t-skip" id="t-skip" class="main">Passer</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ calendrier */
var startUTC = Date.UTC(2026, 10, 23);            // lundi 23 novembre 2026 = S1
var DAY = 864e5;
var JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var JOURS_C = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var DELOAD = [5,10,14,18];
var TESTW = [1,5,10,14,18];
var PH = {
  p1:["Phase 1","Remise en route"], p2:["Phase 2","Construction"], p3:["Phase 3","Spécifique pilote"],
  p4:["Phase 4","Intensité course"], aff:["Affûtage","Moins de volume, même intensité"], sai:["En saison","Entretien entre deux meetings"]
};
var SLOTS = [
  {k:"A",  c:"A", t:"Cou + gainage",                     dur:"20 min",       a:"6 h, avant le bureau",        b:"21 h"},
  {k:"B",  c:"B", t:"Cardio fractionné",                 dur:"25 min",       a:"6 h, avant le bureau",        b:"21 h"},
  {k:"C",  c:"C", t:"Force · cuisses + dos",             dur:"40 min",       a:"12 h 30, à la maison",        b:"17 h au plus tard, tennis à 20 h 30"},
  {k:"m1", c:"m", t:"Micro-séance : cou + vision",       dur:"10 min",       a:"12 h 30 au bureau",           b:"21 h"},
  {k:"F",  c:"F", t:"Force · pectoraux + dos",           dur:"35 à 40 min",  a:"12 h 30, à la maison",        b:"17 h au plus tard, tennis à 20 h 30"},
  {k:"D",  c:"D", t:"Simulateur physique",               dur:"30 à 40 min",  a:"8 h, ou à tes heures de course", b:"21 h"},
  {k:"E",  c:"E", t:"Force · complet + endurance douce", dur:"45 à 50 min",  a:"9 h 30",                      b:"l'après-midi"}
];
var PRIO = ["A","C","E","F","B","D","m1"];
var TESTS = [
  {id:"planche",  n:"Planche ventrale",              u:"s",   s:"A", sw:1, p:"Temps maximal, corps aligné."},

     '<h3>Et 45 minutes tous les jours ?</h3><p>Pas tous les jours : le muscle se construit pendant la récupération, et tu joues déjà au tennis deux fois par semaine. La bonne dose, ce sont trois séances de force de 35 à 50 minutes, le mercredi, le vendredi et le dimanche, et des séances courtes les autres jours.</p></section>';

  h+='<section class="card"><h2>Manger : prise de masse sèche</h2><ul class="list">'+
     '<li><b>Le principe</b> : manger un peu plus que d\'habitude, pas beaucoup plus. Un féculent à chaque repas et une collation après la force suffisent.</li>'+
     '<li><b>Les protéines</b> : au moins 1,6 g par kilo et par jour, en quatre prises. '+protLine()+'</li>'+
     '<li><b>Tes sources</b>, en ordres de grandeur : 2 œufs, 13 g · un steak de 150 g, 30 à 40 g · un pavé de saumon de 150 g, 30 g · un grand verre de lait, 10 g · une assiette de pâtes, 12 g · 2 tranches de pain, 5 g.</li>'+
     '<li><b>Les repères</b> : bœuf, 500 g par semaine au plus, soit 3 steaks ; poisson, deux fois par semaine ; œufs, 2 par jour au plus. Le lait et les féculents font le reste : compte environ un litre de lait par jour.</li>'+
     '<li><b>Si le lait pèse trop</b> : remplace-en une partie par du fromage blanc, ou par une dose de protéines en poudre dans un verre de lait après la force.</li></ul>'+
     '<h3>Une journée type</h3><ul class="list">'+
     '<li>Matin : 2 œufs, du pain, un grand verre de lait.</li>'+
     '<li>Midi : bœuf trois fois par semaine, saumon deux fois, petits pois les autres jours. Toujours avec du riz, des pâtes ou des pommes de terre, et des légumes.</li>'+
     '<li>Après la force, ou vers 16 h : un grand verre de lait et du pain.</li>'+
     '<li>Soir : un féculent, des petits pois ou des légumes, un grand verre de lait.</li></ul>'+
     '<h3>Rester sec</h3><ul class="list">'+
     '<li>Pesée une fois par semaine, le matin, à jeun. Le bon rythme : autour d\'un kilo par mois. Plus vite, c\'est du gras : retire un féculent par jour. Rien ne bouge en trois semaines : ajoutes-en un.</li>'+
     '<li>Tour de taille une fois par mois : s\'il prend plus de 2 cm, tu manges trop.</li>'+
     '<li>Le cardio du mardi et le tennis restent : ce sont eux qui te gardent affûté.</li></ul>'+
     '<h3>Autour des séances</h3><ul class="list">'+
     '<li>Séance de 6 h : à jeun, ça passe pour 20 minutes. Le petit-déjeuner suit tout de suite.</li>'+
     '<li>Force du mercredi et du vendredi : à 12 h 30, le déjeuner juste après. Force du dimanche : après le petit-déjeuner.</li>'+
     '<li>Soirs de tennis : dîner vers 19 h, un verre de lait après si tu as faim.</li>'+
     '<li>Le total de la journée compte plus que la minute exacte.</li></ul></section>';

  h+='<section class="card"><h2>Les phases</h2><div>';
  var rows=[["p1",1,5],["p2",6,10],["p3",11,14],["p4",15,rw-2],["aff",rw-1,rw]];
  rows.forEach(function(r){ var cur=(pos.w>=r[1]&&pos.w<=r[2]);
    h+='<button type="button" class="phase" data-act="goto" data-w="'+r[1]+'" data-i="0"><b>'+PH[r[0]][0]+' · '+PH[r[0]][1]+'</b>'+(cur?'<span class="pill ok">en cours</span>':'<span></span>')+'<small>S'+r[1]+' à S'+r[2]+' · '+fmt(dateOf(r[1],0))+' – '+fmt(dateOf(r[2],6))+'</small></button>'; });
  h+='</div><p class="meta">Semaines allégées + tests : S5, S10, S14 et S18. Elles tombent sur tes fins de mois chargées, c\'est voulu.</p></section>';

  h+='<section class="card"><h2>Rattraper une séance</h2><ol class="list">'+
     '<li><b>Manquée le matin</b> : version express le soir même, vers 21 h, sauf mercredi et vendredi.</li>'+
     '<li><b>Sinon</b> : dans les 48 heures, ou le dimanche.</li>'+
     '<li><b>Une seule séance rattrapée par jour</b>, et jamais deux séances dures le même jour : pas deux séances de force, pas B avec D.</li>'+
     '<li><b>Si la semaine explose</b>, l\'ordre de priorité est A, puis la force du mercredi, du dimanche et du vendredi, puis B, puis D. La semaine plancher : A et deux séances de force. Le tennis fait le reste.</li>'+
     '<li><b>Dimanche soir, la semaine est close.</b> La dette ne se reporte pas. Moins de quatre séances deux semaines de suite : tu refais la même semaine.</li>'+
     '<li><b>Nuit très courte</b> : version express, pas de fractionné dur. Épuisé : cou et vision seulement.</li></ol></section>';

  h+='<section class="card"><h2>Sécurité</h2><ul class="list">'+
     '<li>C\'est une reprise et le plan contient du fractionné intense : <b>fais-le valider par ton médecin</b>. La visite de licence est le bon moment.</li>'+
     '<li><b>Gêne ou douleur</b> : acceptable jusqu\'à 3/10 si elle disparaît dans l\'heure. Au-delà, ou si elle dure plus de deux semaines, médecin ou kiné avant de continuer.</li>'+
     '<li><b>Cou</b> : arrêt immédiat en cas de douleur vive, de fourmillements dans un bras ou de vertige.</li>'+
     '<li>Une douleur dans une articulation n\'est pas une courbature : on arrête l\'exercice concerné, pas la séance.</li></ul></section>';

  h+='<section class="card"><h2>La vision</h2><ul class="list">'+
     '<li><b>L\'acuité ne se muscle pas</b> : elle se mesure et se corrige. Un contrôle chez l\'ophtalmologiste, ou un bilan chez un orthoptiste, avant la saison est le geste le plus rentable.</li>'+
     '<li><b>Ce qui se travaille</b> : la convergence, la vitesse de balayage, l\'attention périphérique, le temps de réaction.</li>'+
     '<li><b>Où c\'est dans la semaine</b> : micro-séance du jeudi, entre les séries le vendredi, Batak avant le simulateur le samedi.</li>'+
     '<li><b>Niveau de preuve</b> : le transfert des exercices visuels généraux vers la performance réelle reste mal démontré. D\'où 5 minutes, pas plus, et l\'essentiel du travail du regard au simulateur.</li></ul></section>';

  h+='<section class="card"><h2>Alertes et réglages</h2><p>Cette appli suit, chronomètre et calcule ce qui reste à rattraper. Elle ne peut pas envoyer de notification : les alertes viennent de l\'application Rappels de ton téléphone.</p>'+
     '<h3>Première course</h3><div class="seg" role="group" aria-label="Date de la première course">'+
     '<button type="button" data-act="race" data-r="2027-04-23" aria-pressed="'+(state.race!=="2027-04-30")+'">23 avril</button>'+
     '<button type="button" data-act="race" data-r="2027-04-30" aria-pressed="'+(state.race==="2027-04-30")+'">30 avril</button></div>'+
     '<p class="meta">23 avril : Grand Prix de France Historique à Dijon, date encore provisoire. 30 avril : Historic Tour à Dijon. L\'affûtage se cale sur ton choix.</p>'+
     '<h3>Données</h3><p class="meta">Tes séances sont enregistrées sur cet appareil, pas sur un serveur. Copie une sauvegarde de temps en temps, dans Notes par exemple.</p>'+
     '<div class="row"><button type="button" class="btn" data-act="backup">Copier une sauvegarde</button><button type="button" class="btn" data-act="restore-open">Restaurer</button></div>'+
     (ui.bk?'<textarea class="copy" readonly aria-label="Sauvegarde">'+esc(ui.bk)+'</textarea>':'')+
     (ui.restore?'<textarea class="copy" id="restore-in" placeholder="Colle ici ta sauvegarde" aria-label="Sauvegarde à restaurer"></textarea><button type="button" class="btn primary" data-act="restore">Restaurer cette sauvegarde</button>':'')+
     (ui.msg?'<p class="meta" role="status">'+esc(ui.msg)+'</p>':'')+
     '<button type="button" class="btn" data-act="reset">'+(ui.resetArm?'Confirmer : tout effacer':'Effacer toutes mes données')+'</button></section>';
  return h;
}

function render(){
  var links=document.querySelectorAll(".tabs a");
  for (var n=0;n<links.length;n++){ if (links[n].getAttribute("href")==="#"+ui.tab) links[n].setAttribute("aria-current","page"); else links[n].removeAttribute("aria-current"); }
  document.getElementById("view").innerHTML = ui.tab==="suivi"?viewSuivi(): ui.tab==="tests"?viewTests(): ui.tab==="reperes"?viewReperes(): viewSeance();
  paintSync();
}

/* ------------------------------------------------------------------ chrono */
var T=null, AC=null, sound=true, wl=null, tmr=document.getElementById("timer");
function audioInit(){ try{ if (!AC){ var C=window.AudioContext||window.webkitAudioContext; if (C) AC=new C(); } if (AC && AC.state==="suspended") AC.resume().catch(function(){}); }catch(e){} }
function beep(f,d){
  if (sound && AC){ try{ var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.03); }catch(e){} }
  try{ if (navigator.vibrate) navigator.vibrate(d>.2?120:40); }catch(e){}
}
function wake(on){ try{ if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ wl=l; }).catch(function(){}); else if (wl){ wl.release().catch(function(){}); wl=null; } }catch(e){} }
function openTimer(cfg){
  T={cfg:cfg, i:-1, paused:false, end:0, left:0, last:-1, h:0};
  tmr.hidden=false; document.body.classList.add("lock"); audioInit(); wake(true);
  if (cfg.sw){ T.t0=performance.now(); paintTimer(); loop(); return; }
  nextStep(); loop();
}
function closeTimer(done){
  if (!T) return; var cfg=T.cfg; clearTimeout(T.h); T=null; tmr.hidden=true; document.body.classList.remove("lock"); wake(false);
  if (done){ beep(988,.6); if (cfg.onEnd) cfg.onEnd(); }
  render();
}
function nextStep(){
  var steps=T.cfg.steps, prev=steps[T.i]; T.i++; var st=steps[T.i];
  if (prev && prev.b!=null && (!st || st.b!==prev.b) && T.cfg.onBlock) T.cfg.onBlock(prev.b);
  if (!st){ closeTimer(true); return; }
  T.last=-1; T.paused=false;
  if (!st.manual){ T.left=st.s*1000; T.end=performance.now()+T.left; }
  beep(st.k==="r"?523:880,.22); paintTimer();
}
function loop(){
  if (!T) return;
  if (T.cfg.sw){ document.getElementById("t-clock").textContent=mmss(Math.floor((performance.now()-T.t0)/1000)); }
  else { var st=T.cfg.steps[T.i];
    if (st && !st.manual && !T.paused){ T.left=T.end-performance.now(); var sec=Math.ceil(T.left/1000);
      if (sec<=3 && sec>0 && sec!==T.last && st.s>=5){ T.last=sec; beep(660,.09); }
      if (T.left<=0){ nextStep(); if (!T) return; } }
    paintClock(); }
  T.h=setTimeout(loop,100);
}
function paintClock(){
  var st=T.cfg.steps[T.i]; if (!st || st.manual) return;
  document.getElementById("t-clock").textContent=mmss(Math.ceil(T.left/1000));
  var tot=T.cfg.total||1, done=T.cfg.before[T.i]+(st.s-T.left/1000);
  document.getElementById("t-bar").style.width=Math.min(100,100*done/tot).toFixed(1)+"%";
}
function paintTimer(){
  var cfg=T.cfg, lab=document.getElementById("t-label"), clk=document.getElementById("t-clock"), man=document.getElementById("t-manual"), nx=document.getElementById("t-next");
  var bp=document.getElementById("t-pause"), bs=document.getElementById("t-skip");
  document.getElementById("t-sound").textContent="Son : "+(sound?"oui":"non");
  if (cfg.sw){ document.getElementById("t-title").textContent="Test"; lab.textContent=cfg.title; man.hidden=true; clk.hidden=false; nx.textContent="Arrête au moment où tu lâches."; tmr.classList.remove("rest");
    bp.hidden=true; bs.textContent="Garder ce temps"; document.getElementById("t-bar").style.width="0"; return; }
  var st=cfg.steps[T.i], next=cfg.steps[T.i+1];
  document.getElementById("t-title").textContent=cfg.title+(st.t&&st.t!==cfg.title?" · "+st.t:"");
  lab.textContent=st.l; tmr.classList.toggle("rest",st.k==="r");
  bp.hidden=false;
  if (st.manual){ clk.hidden=true; man.hidden=false; man.textContent=st.d; bp.disabled=true; bs.textContent="Fait, suivant"; }
  else { clk.hidden=false; man.hidden=true; bp.disabled=false; bp.textContent=T.paused?"Reprendre":"Pause"; bs.textContent="Passer"; paintClock(); }
  nx.textContent=next?"Ensuite : "+next.l:"Dernière étape";
}
function prepSteps(list){ var before=[], tot=0; list.forEach(function(s){ before.push(tot); tot+=s.s||0; }); return {before:before,total:tot}; }
function runBlocks(b, only){
  var steps=[{l:"Prépare-toi",s:5,k:"r",b:null,t:""}];
  b.blocks.forEach(function(bl,n){ if (only!=null && n!==only) return;
    if (bl.steps) bl.steps.forEach(function(s){ steps.push({l:s.l,s:s.s,k:s.k,b:n,t:bl.t}); });
    else if (only==null) steps.push({manual:true,l:bl.t,d:bl.d,b:n,t:bl.t,k:"w"}); });
  var pp=prepSteps(steps), w=b.w, k=b.k, exp=ui.express;
  openTimer({title:"Séance "+b.slot.c, steps:steps, before:pp.before, total:pp.total,
    onBlock:function(n){ var key=w+":"+k, a=state.ck[key]||(state.ck[key]=[]); if (a.indexOf(n)<0){ a.push(n); state.u=Date.now(); saveLocal(); scheduleWrite(); } },
    onEnd:function(){ if (only==null && !logOf(w,k)) setLog(w,k,exp?"x":"f"); }});
}
function setLog(w,k,s){ var L=state.log[w]||(state.log[w]={}); if (s) L[k]={s:s,d:iso(new Date(todayUTC()))}; else delete L[k]; ui.express=false; ui.long=false; commit(); }

/* ------------------------------------------------------------------ événements */
function tabFromHash(){ var h=(location.hash||"").replace("#",""); return (h==="suivi"||h==="tests"||h==="reperes")?h:"seance"; }
function goSeance(w,i){ ui.w=w; ui.i=i; ui.express=false; ui.long=false; if (tabFromHash()!=="seance") location.hash="seance"; else { ui.tab="seance"; render(); } window.scrollTo(0,0); }

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if (!el) return;
  var act=el.getAttribute("data-act"), pos=nowPos();
  if (act!=="reset" && ui.resetArm){ ui.resetArm=false; }
  if (act==="wk"){ ui.w=Math.max(1,ui.w+parseInt(el.getAttribute("data-d"),10)); ui.express=false; ui.long=false; render(); }
  else if (act==="day"){ ui.i=parseInt(el.getAttribute("data-i"),10); ui.express=false; ui.long=false; render(); }
  else if (act==="today"){ ui.w=pos.w; ui.i=pos.i; ui.express=false; ui.long=false; render(); }
  else if (act==="goto"){ goSeance(parseInt(el.getAttribute("data-w"),10), parseInt(el.getAttribute("data-i"),10)); }
  else if (act==="done"){ setLog(ui.w,SLOTS[ui.i].k,ui.express?"x":"f"); }
  else if (act==="undo"){ setLog(ui.w,SLOTS[ui.i].k,null); }
  else if (act==="guide"){ runBlocks(build(ui.w,ui.i,ui.express,ui.long),null); }
  else if (act==="chrono"){ runBlocks(build(ui.w,ui.i,ui.express,ui.long),parseInt(el.getAttribute("data-b"),10)); }
  else if (act==="sw"){ var id=el.getAttribute("data-id"), w=parseInt(el.getAttribute("data-w"),10);
    openTimer({sw:true,title:testById(id).n,onValue:function(v){ (state.tests[w]||(state.tests[w]={}))[id]=v; commit(); }}); }
  else if (act==="tw"){ ui.tw=parseInt(el.getAttribute("data-w"),10); render(); }
  else if (act==="race"){ state.race=el.getAttribute("data-r"); commit(); }
  else if (act==="reset"){ if (!ui.resetArm){ ui.resetArm=true; render(); } else { ui.resetArm=false; var r=state.race; state=blank(); state.race=r; commit(); } }
  else if (act==="copy"){ ui.copy=summaryText(); render(); try{ navigator.clipboard.writeText(ui.copy).then(function(){ el=document.querySelector('[data-act="copy"]'); if (el) el.textContent="Copié"; }).catch(function(){}); }catch(e){} }
  else if (act==="backup"){ ui.bk=JSON.stringify(state); ui.restore=false; ui.msg="Sauvegarde prête : elle est copiée si ton téléphone l'a autorisé, sinon copie le texte ci-dessus."; render(); try{ navigator.clipboard.writeText(ui.bk).catch(function(){}); }catch(e){} }
  else if (act==="restore-open"){ ui.restore=!ui.restore; ui.bk=""; ui.msg=""; render(); }
  else if (act==="restore"){ var ta=document.getElementById("restore-in"), ok=false;
    try{ var o=JSON.parse(ta.value); if (o && typeof o==="object" && o.log && o.tests){ state=merge(o); ok=true; } }catch(e){}
    ui.restore=!ok; ui.msg=ok?"Sauvegarde restaurée.":"Ce texte n'est pas une sauvegarde de l'appli."; if (ok) commit(); else render(); }
  else if (act==="t-stop"){ closeTimer(false); }
  else if (act==="t-sound"){ sound=!sound; audioInit(); if (T) paintTimer(); }
  else if (act==="t-pause"){ if (!T || T.cfg.sw) return; var st=T.cfg.steps[T.i]; if (!st || st.manual) return;
    if (T.paused){ T.paused=false; T.end=performance.now()+T.left; } else { T.paused=true; } paintTimer(); }
  else if (act==="t-skip"){ if (!T) return;
    if (T.cfg.sw){ var v=Math.round((performance.now()-T.t0)/1000), cb=T.cfg.onValue; closeTimer(false); cb(v); }
    else nextStep(); }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if (el.id==="express"){ ui.express=el.checked; if (ui.express) ui.long=false; render(); return; }
  if (el.id==="long"){ ui.long=el.checked; if (ui.long) ui.express=false; render(); return; }
  if (el.hasAttribute("data-ck")){ var key=ui.w+":"+SLOTS[ui.i].k, a=state.ck[key]||(state.ck[key]=[]), n=parseInt(el.getAttribute("data-ck"),10), ix=a.indexOf(n);
    if (el.checked && ix<0) a.push(n); if (!el.checked && ix>=0) a.splice(ix,1); commit(); return; }
  if (el.hasAttribute("data-tennis")){ var L=state.log[ui.w]||(state.log[ui.w]={}); if (el.checked) L[el.getAttribute("data-tennis")]=true; else delete L[el.getAttribute("data-tennis")]; commit(); return; }
  if (el.hasAttribute("data-test")){ var w=parseInt(el.getAttribute("data-w"),10), t=state.tests[w]||(state.tests[w]={}), v=parseFloat(String(el.value).replace(",","."));
    if (isFinite(v) && v>=0) t[el.getAttribute("data-test")]=v; else delete t[el.getAttribute("data-test")]; commit(); return; }
  if (el.hasAttribute("data-dn")){ var d=state.dn[ui.w]||(state.dn[ui.w]={}), val=String(el.value).trim(); if (val) d[el.getAttribute("data-dn")]=val.slice(0,40); else delete d[el.getAttribute("data-dn")]; commit(); return; }
});
window.addEventListener("hashchange",function(){ ui.tab=tabFromHash(); ui.copy=""; ui.bk=""; ui.restore=false; ui.msg=""; render(); window.scrollTo(0,0); });

/* ------------------------------------------------------------------ démarrage */
function start(snap){
  loadLocal();
  var pos=nowPos(); ui.w=(snap&&snap.w)||pos.w; ui.i=(snap&&snap.i!=null)?snap.i:pos.i; ui.tab=tabFromHash();
  var tw=1; TESTW.forEach(function(x){ if (x<=pos.w) tw=x; }); ui.tw=(snap&&snap.tw)||tw;
  render(); initDb();
}
start({});
if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
})();
